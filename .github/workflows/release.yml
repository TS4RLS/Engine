name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
          - os: macos-latest
            asset_name: macos
          - os: ubuntu-latest
            asset_name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: python src/build/create_release_files.py

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p dist_out
          for name in TS4RLS TS4RLS.exe; do
            [ -f "dist/$name" ] && cp "dist/$name" "dist_out/TS4RLS-${{ matrix.asset_name }}${name#TS4RLS}"
          done
          ls -la dist_out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.asset_name }}
          path: dist_out/*

  steam-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build TS4RLS_Steam_Assets.zip
        run: python src/build/create_release_files.py --steam-zip

      - name: Publish to steam_assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan steam_assets
          git reset --hard
          cp dist/TS4RLS_Steam_Assets.zip .
          git add TS4RLS_Steam_Assets.zip
          git commit -m "Update Steam assets (${{ github.ref_name }})"
          git push origin steam_assets --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-assets
          path: dist/TS4RLS_Steam_Assets.zip

  release:
    needs: [build, steam-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          body: |
            > **The text-menu CLI is discontinued and unsupported** (removed in v3.0.0). TS4RLS is GUI-only now, plus `--generate` for headless/unattended use — see the [README](https://github.com/TS4RLS/Engine#readme).
